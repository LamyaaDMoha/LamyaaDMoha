name: Snowy Snake Animation

on:
  workflow_dispatch:
  schedule:
    - cron: "20 4 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Snowy Snake
        uses: Platane/snk@v3
        with:
          github_user_name: LamyaaDMoha
          outputs: |
            dist/snake.gif?color_snake=#B49AF1&color_dots=#25384A,#355B78,#5586A6,#86BAD4,#D3F3FF&color_background=#0D1117

      - name: Save Snake Animation
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
