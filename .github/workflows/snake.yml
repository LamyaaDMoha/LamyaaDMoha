name: Snowy Snake Animation

on:
  workflow_dispatch:
  schedule:
    - cron: "20 4 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Snowy Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: LamyaaDMoha
          outputs: |
            dist/github-snake.svg?color_snake=#E2D8FF&color_dots=#EAF7FF,#D8EEFA,#BDDDF2,#97C7E6,#6FAAD6
            dist/github-snake-dark.svg?color_snake=#E2D8FF&color_dots=#0D1117,#1B2F42,#355C7A,#73A6C9,#DFF5FF

      - name: Publish Snake Animation
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
